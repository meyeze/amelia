<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Amelia — Every Flight, Found</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/cesium@1.119/Build/Cesium/Cesium.js"></script>
<link href="https://cdn.jsdelivr.net/npm/cesium@1.119/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --surface-1:#1a1a19; --page:#0d0d0d;
    --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-muted:#898781;
    --hairline:rgba(255,255,255,0.10); --grid:#2c2c2a;
    /* categorical slots (dark mode) — fixed order, one per aircraft */
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --other:#898781;
    --radius:14px;
    --font:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  html,body{margin:0;height:100%;background:var(--page);font-family:var(--font);color:var(--ink-1);overflow:hidden}
  #globe{position:absolute;inset:0}
  .cesium-viewer-bottom{display:none!important}

  /* ---------- top bar (Google Earth style pill) ---------- */
  .topbar{position:absolute;top:18px;left:18px;z-index:10;display:flex;align-items:center;gap:12px;
    background:rgba(26,26,25,.92);backdrop-filter:blur(10px);border:1px solid var(--hairline);
    border-radius:28px;padding:10px 20px;box-shadow:0 4px 24px rgba(0,0,0,.4)}
  .brand{cursor:pointer}
  .brand .logo{height:26px;display:block}
  .brand .ver{font-size:9px;letter-spacing:.18em;color:var(--ink-muted);margin-top:3px;text-align:left}

  /* ---------- about card (logo click) ---------- */
  .about{position:absolute;top:74px;left:18px;z-index:12;width:240px;display:none;
    background:rgba(26,26,25,.96);backdrop-filter:blur(10px);border:1px solid var(--hairline);
    border-radius:var(--radius);padding:16px;box-shadow:0 4px 24px rgba(0,0,0,.5)}
  .about.show{display:block}
  .about .row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-top:1px solid var(--grid)}
  .about .row:first-of-type{border-top:none}
  .about .egg{margin-top:12px;padding-top:10px;border-top:1px solid var(--grid);
    font-size:10px;letter-spacing:.14em;color:var(--ink-muted);text-align:center;text-transform:uppercase}
  .about .egg span{color:#5176ab}
  .search{background:none;border:none;outline:none;color:var(--ink-1);font-size:14px;width:210px;font-family:var(--font)}
  .search::placeholder{color:var(--ink-muted)}

  /* ---------- filter dock (bottom pill, Google Earth toolbar homage) ---------- */
  .dock{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;z-index:10;display:flex;gap:8px;align-items:center;
    background:rgba(26,26,25,.92);backdrop-filter:blur(10px);border:1px solid var(--hairline);
    border-radius:28px;padding:8px 12px;box-shadow:0 4px 24px rgba(0,0,0,.4);max-width:92vw;overflow-x:auto}
  .chip{display:flex;align-items:center;gap:7px;border:1px solid var(--hairline);border-radius:20px;
    padding:6px 12px;font-size:12.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap;background:transparent;font-family:var(--font)}
  .chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .chip.on{background:rgba(255,255,255,.10);color:var(--ink-1);border-color:rgba(255,255,255,.25)}
  .chip:hover{background:rgba(255,255,255,.06)}
  .divider{width:1px;align-self:stretch;background:var(--hairline);margin:0 4px}

  /* ---------- stats rail (connected — it IS the Black Box) ---------- */
  .stats{position:absolute;top:18px;right:18px;z-index:10;display:flex;flex-direction:column;width:190px;
    background:rgba(26,26,25,.92);backdrop-filter:blur(10px);border:1px solid var(--hairline);
    border-radius:var(--radius);overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.4)}
  .tile{padding:12px 14px;border-top:1px solid var(--grid)}
  .tile:first-child{border-top:none}
  .tile .k{font-size:11px;color:var(--ink-muted);letter-spacing:.04em;text-transform:uppercase}
  .tile .v{font-size:22px;font-weight:650;margin-top:2px}
  .tile .sub{font-size:11px;color:var(--ink-2);margin-top:2px}
  .bbOpen{display:block;width:100%;padding:11px 14px 13px;cursor:pointer;text-align:center;
    background:rgba(111,160,232,.07);border:none;border-top:1px solid var(--grid);font-family:var(--font)}
  .bbOpen:hover{background:rgba(111,160,232,.16)}
  .bbOpen .k{display:block;font-size:9px;letter-spacing:.22em;color:var(--ink-muted);text-transform:uppercase}
  .bbOpen .word{display:block;margin-top:2px;font-size:16px;font-weight:800;font-style:italic;
    letter-spacing:.05em;color:#6FA0E8}

  /* ---------- flight card ---------- */
  .card{position:absolute;left:18px;bottom:168px;z-index:11;width:270px;display:none;
    background:rgba(26,26,25,.95);backdrop-filter:blur(10px);border:1px solid var(--hairline);
    border-radius:var(--radius);padding:16px;box-shadow:0 4px 24px rgba(0,0,0,.5)}
  .card.show{display:block}
  .card h3{margin:0 0 2px;font-size:15px;display:flex;align-items:center;gap:8px}
  .card .when{color:var(--ink-muted);font-size:12px;margin-bottom:10px}
  .row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-top:1px solid var(--grid)}
  .row .l{color:var(--ink-muted)} .row .r{color:var(--ink-1)}
  .badge{font-size:10px;color:var(--ink-muted);border:1px solid var(--hairline);border-radius:10px;padding:1px 7px}
  .close{position:absolute;top:10px;right:12px;color:var(--ink-muted);cursor:pointer;font-size:16px;background:none;border:none}
  .note{font-size:11px;color:var(--ink-muted);margin-top:10px;line-height:1.4}

  /* ---------- THE BLACK BOX (slide-out bento dashboard) ---------- */
  .wrapped{position:absolute;top:0;right:0;bottom:0;z-index:15;width:min(62vw,900px);
    background:#0a0a0a;border-left:1px solid var(--hairline);
    transform:translateX(102%);transition:transform .45s cubic-bezier(.22,.9,.32,1);
    overflow-y:auto;padding:16px 16px 28px}
  .wrapped.open{transform:translateX(0)}
  .wrapped .wclose{position:fixed;top:16px;right:20px;z-index:16;background:rgba(22,22,22,.9);
    border:1px solid rgba(255,255,255,.18);border-radius:50%;width:34px;height:34px;
    color:#f2f1ea;font-size:15px;cursor:pointer;display:none}
  .wrapped.open .wclose{display:block}
  .bb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .bb{border-radius:22px;padding:18px;color:#131208;position:relative;overflow:hidden;min-width:0}
  .bb.s2{grid-column:span 2} .bb.s3{grid-column:span 3}
  .bb.purple{background:#A796E8} .bb.yellow{background:#F0E63C} .bb.olive{background:#A69E24}
  .bb.orange{background:#F04E23;color:#1a0c06} .bb.sage{background:#DFE5D8} .bb.green{background:#4FB56B}
  .bb.dark{background:#161616;color:#f2f1ea}
  .bb.olive{display:flex;flex-direction:column}
  .bb.olive .vbars{flex:1;height:auto;min-height:110px}
  .bb .pill{display:inline-block;border:1.5px solid currentColor;border-radius:999px;
    padding:4px 13px;font-size:11px;font-weight:650;letter-spacing:.02em}
  .bb .big{font-size:42px;font-weight:750;letter-spacing:-.02em;line-height:1.05;margin:12px 0 4px;
    font-variant-numeric:tabular-nums}
  .bb .big small{font-size:22px;font-weight:700}
  .bb .sub{font-size:12px;opacity:.78;line-height:1.45}
  .bb .cap{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.65;margin-top:10px}
  .bb h1{margin:6px 0 0;font-size:52px;font-weight:790;letter-spacing:-.02em;line-height:1}
  .bb .hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  /* thin vertical bars (Growth-card style) */
  .vbars{display:flex;align-items:flex-end;gap:6px;height:96px;margin-top:16px}
  .vbars .vb{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;height:100%;justify-content:flex-end}
  .vbars .vb i{width:4px;background:#15130a;border-radius:2px;min-height:3px}
  .vbars .vb b{font-size:9px;font-weight:600;opacity:.7;transform:none;font-variant-numeric:tabular-nums}
  /* waveform (header, monthly cadence) */
  .wave{display:flex;align-items:flex-end;gap:2px;height:58px;margin-top:18px}
  .wave i{flex:1;min-width:1px;background:rgba(15,8,50,.5);border-radius:1px}
  .wave i.pk{background:#15082e}
  .tag{position:absolute;background:#141414;color:#fff;font-size:10px;font-weight:600;
    border-radius:9px;padding:4px 9px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .tag:after{content:"";position:absolute;left:50%;top:100%;margin-left:-4px;
    border:4px solid transparent;border-top-color:#141414}
  /* horizontal rows with fat black bars (Spending-limits style) */
  .hrow{display:flex;align-items:center;gap:10px;font-size:12.5px;margin:8px 0;font-weight:550}
  .hrow .l{width:118px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hrow .t{flex:1;display:flex;align-items:center;gap:8px}
  .hrow .b{height:7px;border-radius:5px;background:#141414;min-width:5px}
  .hrow .n{font-size:11px;font-weight:650;opacity:.75;font-variant-numeric:tabular-nums}
  .bb.dark .hrow .b{background:#e8e6da}
  /* mini calendar (record-day card) */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;margin-top:12px}
  .cal .h{font-size:8px;letter-spacing:.1em;opacity:.55;padding:2px 0}
  .cal .d{font-size:11.5px;padding:4px 0;border-radius:50%;font-variant-numeric:tabular-nums}
  .cal .d.hot{background:#F04E23;color:#fff;font-weight:750}
  /* fact rows */
  .frow{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:7px 0;
    border-top:1px solid rgba(255,255,255,.12)}
  .frow:first-of-type{border-top:none}
  .frow .l{opacity:.6} .frow .r{text-align:right;font-weight:600}
  .bb .goal{margin-top:14px}
  .bb .goal .gt{display:flex;justify-content:space-between;font-size:11px;font-weight:600;margin-bottom:6px}
  .bb .goal .gb{height:9px;border-radius:6px;background:rgba(15,10,40,.25);overflow:hidden}
  .bb .goal .gb i{display:block;height:100%;border-radius:6px;background:#141414}
  .bb .foot{display:flex;align-items:center;gap:14px;font-size:24px;font-weight:750;letter-spacing:-.01em}
  .bb .foot .ic{width:44px;height:44px;border-radius:50%;background:#e8e6da;color:#141414;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
  .fleetdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;flex:none}

  /* ---------- map style switcher ---------- */
  .styles{position:absolute;left:18px;bottom:74px;z-index:10;display:flex;flex-direction:row;
    background:rgba(26,26,25,.92);backdrop-filter:blur(10px);border:1px solid var(--hairline);
    border-radius:14px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.4)}
  .styles button{background:none;border:none;color:var(--ink-2);font-family:var(--font);font-size:11px;
    letter-spacing:.08em;padding:9px 14px;cursor:pointer;border-right:1px solid var(--hairline)}
  .styles button:last-child{border-right:none}
  .styles button.on{background:rgba(81,118,171,.28);color:var(--ink-1)}
  .styles button:hover:not(.on){background:rgba(255,255,255,.06)}
  .styles.layers{bottom:117px}

  /* ---------- cluster hover tooltip ---------- */
  .clusterTip{position:absolute;z-index:20;display:none;pointer-events:none;
    background:rgba(26,26,25,.95);border:1px solid var(--hairline);border-radius:10px;
    padding:4px 10px;font-size:11px;letter-spacing:.05em;color:var(--ink-1);
    box-shadow:0 2px 12px rgba(0,0,0,.5);white-space:nowrap}
</style>
</head>
<body>
<div id="globe"></div>

<div class="topbar">
  <div class="brand" id="brand"><img src="assets/logo.png" alt="AMELIA" class="logo"></div>
  <input class="search" id="search" placeholder="Search flights, places, years…">
</div>

<div class="stats" id="stats"></div>

<div class="dock" id="dock"></div>

<div class="card" id="card"></div>

<div class="about" id="about">
  <div class="row"><span class="l" style="color:var(--ink-muted)">Version</span><span id="aboutVer"></span></div>
  <div class="row"><span class="l" style="color:var(--ink-muted)">Released</span><span id="aboutDate"></span></div>
  <div class="row"><span class="l" style="color:var(--ink-muted)">Flights indexed</span><span id="aboutFlights"></span></div>
  <div class="row"><span class="l" style="color:var(--ink-muted)">Data span</span><span id="aboutSpan"></span></div>
  <div class="egg">A <span>Mize Creative</span> × <span>Drone Lawrence</span> project<br>
  <span style="color:var(--ink-muted)">Named for Amelia Earhart · Atchison, KS</span></div>
</div>

<div class="wrapped" id="wrapped">
  <button class="wclose" id="wclose">✕</button>
  <div class="bb-grid" id="wbody"></div>
</div>

<div class="styles layers" id="layers">
  <button id="pathsBtn" title="Show or hide flight paths">PATHS</button>
</div>

<div class="styles" id="styles">
  <button data-style="clean" class="on">CLEAN</button>
  <button data-style="hybrid">HYBRID</button>
  <button data-style="slate">SLATE</button>
</div>

<div class="clusterTip" id="clusterTip"></div>

<script>
const BUILD = { version: "1.4.0", released: "August 7, 2026" };
const AIRCRAFT_ORDER = ["Mavic Pro","Mini 3 Pro","Mini 4 Pro","Mavic 2 Zoom","Mavic 3","Spark","Phantom 3 Advanced","Recovered footage","Unknown"];
const COLORS = {
  "Mavic Pro":            getCss('--s1'),
  "Mini 3 Pro":           getCss('--s2'),
  "Mini 4 Pro":           getCss('--s3'),
  "Mavic 2 Zoom":         getCss('--s4'),
  "Mavic 3":              getCss('--s5'),
  "Spark":                getCss('--s6'),
  "Phantom 3 Advanced":   getCss('--s7'),
  "Recovered footage":    getCss('--s8'),
  "Unknown":              getCss('--other'),
};
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

let FLIGHTS = [], ALL = [];
const state = { aircraft: new Set(), yearMin: 0, yearMax: 9999, q: "", showPaths: false };

const viewer = new Cesium.Viewer("globe", {
  animation:false, timeline:false, baseLayerPicker:false, geocoder:false,
  homeButton:false, sceneModePicker:false, navigationHelpButton:false,
  fullscreenButton:false, infoBox:false, selectionIndicator:false,
  imageryProvider:false,
});
viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString("#0d0d0d");
viewer.scene.skyAtmosphere.show = true;

// flight layer with clustering (clusters at far zoom, individual pins up close)
const ds = new Cesium.CustomDataSource("flights");
viewer.dataSources.add(ds);
ds.clustering.enabled = true;
ds.clustering.pixelRange = 65;
ds.clustering.minimumClusterSize = 3;
ds.clustering.clusterEvent.addEventListener((clustered, cluster) => {
  cluster.label.show = false;
  cluster.billboard.show = true;
  cluster.billboard.image = clusterSprite(clustered.length);
  cluster.billboard.verticalOrigin = Cesium.VerticalOrigin.CENTER;
  cluster.billboard.id = { cluster: true, entities: clustered, count: clustered.length };
});
// heatmap-style cluster bubbles — no numbers, count shown on hover.
// Cool (blue/teal) for small clusters → hot (orange/red) for big ones, sized by count.
const HEAT_STOPS = [[56,132,244],[45,212,191],[250,204,21],[249,115,22],[230,57,70]];
function heatColor(n){
  const t = Math.max(0, Math.min(1, Math.log(n/3) / Math.log(200/3)));
  const seg = Math.min(HEAT_STOPS.length-2, Math.floor(t*(HEAT_STOPS.length-1)));
  const u = t*(HEAT_STOPS.length-1) - seg;
  const a = HEAT_STOPS[seg], b = HEAT_STOPS[seg+1];
  return [0,1,2].map(i => Math.round(a[i] + (b[i]-a[i])*u));
}
const clusterCache = {};
let baseMode = "dark"; // "dark" = slate; "sat" = clean/hybrid imagery (needs more punch)
function clusterSprite(n){
  // quantize count so the sprite cache stays small
  const q = n < 20 ? n : n < 50 ? Math.round(n/5)*5 : n < 200 ? Math.round(n/25)*25 : 250;
  const key = q + baseMode;
  if (clusterCache[key]) return clusterCache[key];
  const r = Math.min(46, 13 + 5.5*Math.log2(Math.max(q,3)/3));
  const [R,G,B] = heatColor(q);
  const rgba = a => `rgba(${R},${G},${B},${a})`;
  const sat = baseMode === "sat";
  const pad = sat ? 10 : 3;
  const S = Math.ceil(2*(r+pad)), c = document.createElement("canvas");
  c.width = c.height = S;
  const x = c.getContext("2d"), m = S/2;
  if (sat) {
    // dark halo + shadow so bubbles read over satellite imagery
    x.save();
    x.shadowColor = "rgba(0,0,0,0.65)"; x.shadowBlur = 9; x.shadowOffsetY = 2;
    x.beginPath(); x.arc(m, m, r, 0, 7);
    x.fillStyle = rgba(0.30); x.fill();
    x.restore();
    x.beginPath(); x.arc(m, m, r, 0, 7);
    x.lineWidth = 4; x.strokeStyle = "rgba(0,0,0,0.55)"; x.stroke();
    x.lineWidth = 2; x.strokeStyle = rgba(1); x.stroke();
    x.beginPath(); x.arc(m, m, 3.5, 0, 7);
    x.fillStyle = rgba(1); x.fill();
    x.lineWidth = 1.5; x.strokeStyle = "rgba(0,0,0,0.6)"; x.stroke();
  } else {
    x.beginPath(); x.arc(m, m, r, 0, 7);
    x.fillStyle = rgba(0.16); x.fill();
    x.lineWidth = 1.5; x.strokeStyle = rgba(0.85); x.stroke();
    x.beginPath(); x.arc(m, m, 3, 0, 7);
    x.fillStyle = rgba(0.6); x.fill();
  }
  clusterCache[key] = c;
  return c;
}

// Map styles — keyless Esri services; base swaps for Google photorealistic 3D tiles once API key exists
const ARCGIS = "https://services.arcgisonline.com/ArcGis/rest/services/";
const STYLE_DEFS = {
  clean:  { layers: [ARCGIS + "World_Imagery/MapServer"] },
  hybrid: { layers: [ARCGIS + "World_Imagery/MapServer",
                     ARCGIS + "Reference/World_Boundaries_and_Places/MapServer"] },
  slate:  { layers: [ARCGIS + "Canvas/World_Dark_Gray_Base/MapServer"] },
};
const providerCache = {};
async function getProvider(url) {
  if (!providerCache[url]) providerCache[url] = await Cesium.ArcGisMapServerImageryProvider.fromUrl(url);
  return providerCache[url];
}
async function setStyle(name) {
  document.querySelectorAll("#styles button").forEach(b => b.classList.toggle("on", b.dataset.style === name));
  baseMode = (name === "slate") ? "dark" : "sat";
  // force re-cluster so bubbles pick up the mode-appropriate sprites
  const pr = ds.clustering.pixelRange; ds.clustering.pixelRange = 0; ds.clustering.pixelRange = pr;
  try {
    const providers = await Promise.all(STYLE_DEFS[name].layers.map(getProvider));
    viewer.imageryLayers.removeAll();
    providers.forEach(p => viewer.imageryLayers.addImageryProvider(p));
  } catch(e) {
    viewer.imageryLayers.removeAll();
    viewer.imageryLayers.addImageryProvider(new Cesium.OpenStreetMapImageryProvider({url:"https://tile.openstreetmap.org/"}));
  }
}
document.querySelectorAll("#styles button").forEach(b => b.onclick = () => setStyle(b.dataset.style));
setStyle("clean");

// flight-path visibility toggle (off by default — zoomed-out paths read as smudges)
document.getElementById("pathsBtn").onclick = () => {
  state.showPaths = !state.showPaths;
  document.getElementById("pathsBtn").classList.toggle("on", state.showPaths);
  render();
};

// GOOGLE 3D TILES (ready — needs key):
// const tileset = await Cesium.Cesium3DTileset.fromUrl(
//   `https://tile.googleapis.com/v1/3dtiles/root.json?key=${GOOGLE_KEY}`);
// viewer.scene.primitives.add(tileset);

fetch("data/flights.json", {cache: "no-cache"}).then(r=>r.json()).then(d => {
  ALL = d.flights;
  FLIGHTS = d.flights.filter(f => f.lat && f.lon && !f.genericLocation);
  AIRCRAFT_ORDER.forEach(a => state.aircraft.add(a));
  buildDock(); render(); initMeta(); buildBlackBox();
  viewer.camera.flyTo({destination: Cesium.Cartesian3.fromDegrees(-95.26, 38.97, 2200000), duration: 2.5});
});

// ---------- version + about card ----------
function initMeta(){
  document.getElementById("aboutVer").textContent = "v" + BUILD.version;
  document.getElementById("aboutDate").textContent = BUILD.released;
  document.getElementById("aboutFlights").textContent = ALL.length.toLocaleString();
  const yrs = ALL.map(f => +((f.start||"").slice(0,4))).filter(Boolean);
  document.getElementById("aboutSpan").textContent = Math.min(...yrs) + " – " + Math.max(...yrs);
}
document.getElementById("brand").onclick = () => document.getElementById("about").classList.toggle("show");

// ---------- wrapped panel ----------
const HOME = [38.9717, -95.2353]; // Lawrence
const REGIONS = [ // rough bounding boxes, checked in order; approximate by design
  ["Bahamas","🇧🇸",[23.7,27.5,-79.5,-72.7]], ["Canada","🇨🇦",[48.99,60,-139,-52]],
  ["Costa Rica","🇨🇷",[8.0,11.3,-86.0,-82.5]], ["Canary Islands (Spain)","🇮🇨",[27.5,29.5,-18.4,-13.3]],
  ["Portugal","🇵🇹",[36.9,42.2,-9.6,-6.2]], ["Mexico","🇲🇽",[14.5,32.7,-118.4,-86.7]],
  ["Kansas","US",[36.99,40.01,-102.05,-94.59]], ["Colorado","US",[36.99,41.01,-109.06,-102.04]],

function region(lat, lon){
  for (const [name, cc, [a,b,c2,d]] of REGIONS)
    if (lat >= a && lat <= b && lon >= c2 && lon <= d) return { name, country: cc === "US" ? "United States" : name };
  if (lat >= 24 && lat <= 49.5 && lon >= -125 && lon <= -66) return { name: null, country: "United States" };
  return null;
}
const hav2 = (a1,o1,a2,o2) => { const R=3958.8, r=Math.PI/180;
  const s = Math.sin((a2-a1)*r/2)**2 + Math.cos(a1*r)*Math.cos(a2*r)*Math.sin((o2-o1)*r/2)**2;
  return 2*R*Math.asin(Math.sqrt(s)); };

function buildBlackBox(){
  const mapped = FLIGHTS;
  const states = new Set(), countries = new Set();
  mapped.forEach(f => { const r = region(f.lat, f.lon);
    if (r) { countries.add(r.country); if (r.country === "United States" && r.name) states.add(r.name); } });
  // most flights in one day
  const byDay = {};
  ALL.forEach(f => { const d = (f.start||"").slice(0,10); if (d) byDay[d] = (byDay[d]||0)+1; });
  const [topDay, topDayN] = Object.entries(byDay).sort((a,b)=>b[1]-a[1])[0] || ["—",0];
  // longest flight by distance
  const longest = mapped.filter(f=>f.distanceKm).sort((a,b)=>b.distanceKm-a.distanceKm)[0];
  // farthest from home
  let far = null, farD = 0;
  mapped.forEach(f => { const d = hav2(HOME[0],HOME[1],f.lat,f.lon); if (d > farD) { farD = d; far = f; } });
  // media
  const photos = ALL.reduce((s,f)=>s+(f.photos||0),0);
  const videos = ALL.reduce((s,f)=>s+(f.videoCount||0),0);
  // monthly cadence (full range, zeros filled) for the header waveform
  const byMonth = {};
  ALL.forEach(f => { const m = (f.start||"").slice(0,7); if (m) byMonth[m] = (byMonth[m]||0)+1; });
  const monKeys = Object.keys(byMonth).sort();
  const months = [];
  if (monKeys.length) {
    let [y, m] = monKeys[0].split("-").map(Number);
    const [ey, em] = monKeys[monKeys.length-1].split("-").map(Number);
    while (y < ey || (y === ey && m <= em)) {
      const k = y + "-" + String(m).padStart(2,"0");
      months.push([k, byMonth[k] || 0]);
      m++; if (m > 12) { m = 1; y++; }
    }
  }
  const maxM = Math.max(1, ...months.map(x=>x[1]));
  const pkIdx = months.findIndex(x=>x[1]===maxM);
  const [topMon, topMonN] = Object.entries(byMonth).sort((a,b)=>b[1]-a[1])[0] || ["—",0];
  // years bars
  const byYear = {};
  ALL.forEach(f => { const y = (f.start||"").slice(0,4); if (y) byYear[y] = (byYear[y]||0)+1; });
  const yearsArr = Object.entries(byYear).sort((a,b)=>a[0].localeCompare(b[0]));
  const maxY = Math.max(...yearsArr.map(y=>y[1]));
  // top locations
  const byLoc = {};
  mapped.forEach(f => { const k = f.city || (f.lat.toFixed(2)+", "+f.lon.toFixed(2)); byLoc[k]=(byLoc[k]||0)+1; });
  const topLocs = Object.entries(byLoc).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxL = topLocs.length ? topLocs[0][1] : 1;
  // fleet
  const byAc = {};
  ALL.forEach(f => { byAc[f.aircraft] = (byAc[f.aircraft]||0)+1; });
  const fleet = AIRCRAFT_ORDER.filter(a=>byAc[a]).map(a=>[a, byAc[a]]);
  const maxA = Math.max(...fleet.map(f=>f[1]));
  // records
  const topSpeed = Math.max(0, ...ALL.map(f=>f.maxSpeedMs||0)) * 2.237;
  const maxAlt = Math.max(0, ...ALL.map(f=>f.maxAltM||0)) * 3.281;
  const yrs = ALL.map(f => +((f.start||"").slice(0,4))).filter(Boolean);
  const span = Math.min(...yrs) + "–" + Math.max(...yrs);

  const fdate = s => s === "—" ? s : new Date(s+"T12:00:00").toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
  const fmon = s => s === "—" ? s : new Date(s+"-15T12:00:00").toLocaleDateString(undefined,{year:"numeric",month:"long"});

  // mini calendar for the record day (Monday-first)
  let calHtml = "";
  if (topDay !== "—") {
    const d = new Date(topDay+"T12:00:00");
    const yy = d.getFullYear(), mm = d.getMonth(), hot = d.getDate();
    const first = (new Date(yy, mm, 1).getDay() + 6) % 7; // Mon=0
    const nDays = new Date(yy, mm+1, 0).getDate();
    calHtml = ["MON","TUE","WED","THU","FRI","SAT","SUN"].map(h=>`<span class="h">${h}</span>`).join("")
      + `<span></span>`.repeat(first)
      + Array.from({length:nDays},(_,i)=>`<span class="d${i+1===hot?" hot":""}">${i+1}</span>`).join("");
  }

  const waveHtml = months.map(([k,n],i) =>
    `<i style="height:${Math.max(3,(n/maxM*100)).toFixed(1)}%"${i===pkIdx?' class="pk"':''}></i>`).join("");
  const pkLeft = months.length > 1 ? (pkIdx/(months.length-1)*100).toFixed(1) : 50;

  document.getElementById("wbody").innerHTML = `
    <div class="bb purple s3">
      <div class="hdr"><span class="pill">FLIGHT RECORDER</span><span class="pill">${span}</span></div>
      <h1>BLACK BOX</h1>
      <div class="sub" style="margin-top:6px">Every flight, found · ${ALL.length.toLocaleString()} flights · a decade of drone data</div>
      <div style="position:relative;margin-top:34px">
        <span class="tag" style="left:${pkLeft}%;transform:translateX(-50%);top:-28px">${topMonN} flights · ${fmon(topMon)}</span>
        <div class="wave" style="margin-top:0">${waveHtml}</div>
      </div>
    </div>

    <div class="bb yellow">
      <span class="pill">US STATES</span>
      <div class="big">${states.size}</div>
      <div class="sub">${[...states].slice(0,6).join(", ")}${states.size>6?"…":""}</div>
    </div>
    <div class="bb orange">
      <span class="pill">COUNTRIES</span>
      <div class="big">${countries.size}</div>
      <div class="sub">${[...countries].join(", ")}</div>
    </div>
    <div class="bb green">
      <span class="pill">MEDIA CAPTURED</span>
      <div class="big">${photos.toLocaleString()}</div>
      <div class="sub">photos · ${videos.toLocaleString()} videos from the sky</div>
    </div>

    <div class="bb olive s2">
      <div class="hdr"><span class="pill">FLIGHTS BY YEAR</span></div>
      <div class="vbars">
        ${yearsArr.map(([y,n]) => `<div class="vb" ${n===maxY?'style="position:relative"':''}>
          ${n===maxY?`<span class="tag" style="left:50%;transform:translateX(-50%);top:-8px">${n}</span>`:""}
          <i style="height:${Math.max(4,(n/maxY*72)).toFixed(1)}%"></i><b>’${y.slice(2)}</b></div>`).join("")}
      </div>
    </div>
    <div class="bb dark">
      <span class="pill">RECORD DAY</span>
      <div class="cal">${calHtml}</div>
      <div class="cap">${topDayN} flights · ${fdate(topDay)}</div>
    </div>

    <div class="bb purple">
      <span class="pill">FARTHEST FROM HOME</span>
      <div class="big">${far ? Math.round(farD).toLocaleString() : "—"}<small> mi</small></div>
      <div class="sub">${far ? (far.city || far.lat.toFixed(2)+", "+far.lon.toFixed(2)) : ""}</div>
      <div class="goal"><div class="gt"><span>Lawrence, KS</span><span>${far ? (far.city||"").split(",")[0] : ""}</span></div>
        <div class="gb"><i style="width:${Math.min(100, farD/12450*100).toFixed(1)}%"></i></div></div>
    </div>
    <div class="bb yellow">
      <span class="pill">LONGEST FLIGHT</span>
      <div class="big">${longest ? (longest.distanceKm*0.6214).toFixed(1) : "—"}<small> mi</small></div>
      <div class="sub">${longest ? [longest.city, fdate((longest.start||"").slice(0,10))].filter(Boolean).join(" · ") : ""}</div>
    </div>
    <div class="bb dark">
      <span class="pill">DEEP CUTS</span>
      <div style="margin-top:12px">
        <div class="frow"><span class="l">Top speed</span><span class="r">${topSpeed ? topSpeed.toFixed(1)+" mph" : "—"}</span></div>
        <div class="frow"><span class="l">Max altitude</span><span class="r">${maxAlt ? Math.round(maxAlt).toLocaleString()+" ft" : "—"}</span></div>
        <div class="frow"><span class="l">Busiest month</span><span class="r">${fmon(topMon)}</span></div>
        <div class="frow"><span class="l">Recovered from footage</span><span class="r">${ALL.filter(f=>f.source==="srt").length}</span></div>
      </div>
    </div>

    <div class="bb sage s2">
      <span class="pill">MOST FLOWN SPOTS</span>
      <div style="margin-top:12px">
        ${topLocs.map(([k,n]) => `<div class="hrow"><span class="l">${k}</span>
          <span class="t"><span class="b" style="width:${(n/maxL*100).toFixed(1)}%"></span><span class="n">${n}</span></span></div>`).join("")}
      </div>
    </div>
    <div class="bb dark">
      <span class="pill">THE FLEET</span>
      <div style="margin-top:12px">
        ${fleet.map(([a,n]) => `<div class="hrow" style="font-size:11px"><span class="l"><span class="fleetdot" style="background:${COLORS[a]}"></span>${a}</span>
          <span class="t"><span class="b" style="width:${(n/maxA*100).toFixed(1)}%;background:${COLORS[a]}"></span><span class="n">${n}</span></span></div>`).join("")}
      </div>
    </div>

    <div class="bb dark s3"><div class="foot"><span class="ic">i</span>MEYEZE.GITHUB.IO/AMELIA</div></div>`;
}
document.getElementById("wclose").onclick = () => document.getElementById("wrapped").classList.remove("open");

function years(){ return [...new Set(FLIGHTS.map(f=>+f.start?.slice(0,4)).filter(Boolean))].sort(); }

function buildDock(){
  const dock = document.getElementById("dock");
  dock.innerHTML = "";
  const allBtn = document.createElement("button");
  allBtn.className = "chip";
  allBtn.textContent = "All drones";
  allBtn.onclick = () => {
    AIRCRAFT_ORDER.forEach(a => state.aircraft.add(a));
    dock.querySelectorAll("button.chip[data-aircraft]").forEach(b => b.classList.add("on"));
    render();
  };
  dock.appendChild(allBtn);
  dock.insertAdjacentHTML("beforeend", `<div class="divider"></div>`);
  AIRCRAFT_ORDER.filter(a => FLIGHTS.some(f=>f.aircraft===a)).forEach(a => {
    const b = document.createElement("button");
    b.className = "chip on";
    b.dataset.aircraft = a;
    b.innerHTML = `<span class="dot" style="background:${COLORS[a]}"></span>${a}`;
    b.onclick = () => { state.aircraft.has(a) ? state.aircraft.delete(a) : state.aircraft.add(a);
      b.classList.toggle("on"); render(); };
    dock.appendChild(b);
  });
  dock.insertAdjacentHTML("beforeend", `<div class="divider"></div>`);
  const ys = years();
  const sel = document.createElement("select");
  sel.className = "chip"; sel.style.appearance = "none";
  sel.innerHTML = `<option value="all">All years</option>` + ys.map(y=>`<option>${y}</option>`).join("");
  sel.onchange = () => { if (sel.value==="all"){state.yearMin=0;state.yearMax=9999;} else {state.yearMin=+sel.value;state.yearMax=+sel.value;} render(); };
  dock.appendChild(sel);
  document.getElementById("search").oninput = e => { state.q = e.target.value.toLowerCase(); render(); };
}

function visible(){
  return FLIGHTS.filter(f => {
    const y = +f.start?.slice(0,4);
    if (!state.aircraft.has(f.aircraft)) return false;
    if (y < state.yearMin || y > state.yearMax) return false;
    if (state.q && !(`${f.aircraft} ${f.city||""} ${f.area||""} ${f.start||""}`.toLowerCase().includes(state.q))) return false;
    return true;
  });
}

const spriteCache = {};
function hexToRgba(hex, a){
  const n = parseInt(hex.replace("#",""), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function glowSprite(hex, ring){
  const key = hex + (ring ? "r" : "s");
  if (spriteCache[key]) return spriteCache[key];
  const S = 64, c = document.createElement("canvas");
  c.width = c.height = S;
  const x = c.getContext("2d"), m = S/2;
  const g = x.createRadialGradient(m, m, 3, m, m, m);
  g.addColorStop(0, hexToRgba(hex, 0.40));
  g.addColorStop(0.35, hexToRgba(hex, 0.13));
  g.addColorStop(1, hexToRgba(hex, 0));
  x.fillStyle = g;
  x.fillRect(0, 0, S, S);
  x.beginPath(); x.arc(m, m, 7.5, 0, 7);
  if (ring) {
    x.fillStyle = hexToRgba(hex, 0.16); x.fill();
    x.lineWidth = 3; x.strokeStyle = hex; x.stroke();
  } else {
    x.fillStyle = hex; x.fill();
    x.lineWidth = 1.5; x.strokeStyle = "rgba(13,13,13,0.85)"; x.stroke();
  }
  spriteCache[key] = c;
  return c;
}

let entities = [];
function render(){
  ds.entities.removeAll(); entities = [];
  const vis = visible();
  vis.forEach(f => {
    const c = Cesium.Color.fromCssColorString(COLORS[f.aircraft] || "#898781");
    const hex = COLORS[f.aircraft] || "#898781";
    const e = ds.entities.add({
      position: Cesium.Cartesian3.fromDegrees(f.lon, f.lat),
      billboard: { image: glowSprite(hex, !!f.approx), width: 40, height: 40,
        scaleByDistance: new Cesium.NearFarScalar(2e5, 1.35, 8e6, 0.65) },
      properties: { flight: f },
    });
    entities.push(e);
    if (state.showPaths) {
      if (f.preview && f.preview.length > 1) {
        const line = ds.entities.add({
          polyline: {
            positions: Cesium.Cartesian3.fromDegreesArray(f.preview.flat()),
            width: 2, material: c.withAlpha(0.75), clampToGround: false },
          properties: { flight: f },
        });
        entities.push(line);
      }
      (f.recoveredSegs || []).forEach(seg => {
        if (seg.length < 2) return;
        const line = ds.entities.add({
          polyline: {
            positions: Cesium.Cartesian3.fromDegreesArray(seg.flat()),
            width: 2,
            material: new Cesium.PolylineDashMaterialProperty({ color: c.withAlpha(0.85), dashLength: 12 }) },
          properties: { flight: f },
        });
        entities.push(line);
      });
    }
  });
  const pr = ds.clustering.pixelRange; ds.clustering.pixelRange = 0; ds.clustering.pixelRange = pr;
  stats(vis);
}

function stats(vis){
  const mins = vis.reduce((s,f)=>s+(f.durationMin||0),0);
  const miles = vis.reduce((s,f)=>s+(f.distanceKm||0),0)*0.6214;
  const places = new Set(vis.map(f => `${f.lat?.toFixed(2)},${f.lon?.toFixed(2)}`)).size;
  const withTracks = vis.filter(f=>f.hasTrack).length;
  const el = document.getElementById("stats");
  el.innerHTML = `
    <div class="tile"><div class="k">Flights</div><div class="v">${vis.length}</div>
      <div class="sub">${withTracks} with full paths${ALL.length - FLIGHTS.length ? ` · ${ALL.length - FLIGHTS.length} pending location` : ""}</div></div>
    <div class="tile"><div class="k">Airtime</div><div class="v">${(mins/60).toFixed(1)} h</div>
      <div class="sub">${Math.round(mins).toLocaleString()} minutes</div></div>
    <div class="tile"><div class="k">Distance flown</div><div class="v">${miles >= 100 ? Math.round(miles) : miles.toFixed(1)} mi</div>
      <div class="sub">from decrypted tracks</div></div>
    <div class="tile"><div class="k">Locations</div><div class="v">${places}</div>
      <div class="sub">distinct takeoff spots</div></div>
    <button class="bbOpen" onclick="document.getElementById('wrapped').classList.add('open')">
      <span class="k">View the</span><span class="word">BLACK BOX</span></button>`;
}

// flight card on click
const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
handler.setInputAction(m => {
  const picked = viewer.scene.pick(m.position);
  if (picked?.id?.cluster) {
    const pos = picked.id.entities[0].position.getValue(Cesium.JulianDate.now());
    const carto = Cesium.Cartographic.fromCartesian(pos);
    const h = Math.max(viewer.camera.positionCartographic.height / 3.5, 2500);
    viewer.camera.flyTo({ destination: Cesium.Cartesian3.fromRadians(carto.longitude, carto.latitude, h), duration: 1.1 });
    return;
  }
  const card = document.getElementById("card");
  if (picked?.id?.properties?.flight) {
    const f = picked.id.properties.flight.getValue();
    const dt = f.start ? new Date(f.start) : null;
    card.innerHTML = `
      <button class="close" onclick="this.parentElement.classList.remove('show')">✕</button>
      <h3><span class="dot" style="width:10px;height:10px;border-radius:50%;background:${COLORS[f.aircraft]}"></span>
        ${f.aircraft} <span class="badge">${f.source.toUpperCase()}</span></h3>
      <div class="when">${dt ? dt.toLocaleString(undefined,{dateStyle:"full",timeStyle:"short"}) : "—"}</div>
      <div class="row"><span class="l">Duration</span><span class="r">${f.durationMin ? f.durationMin.toFixed(1)+" min" : "—"}</span></div>
      ${f.distanceKm != null ? `<div class="row"><span class="l">Distance</span><span class="r">${(f.distanceKm*0.6214).toFixed(2)} mi</span></div>` : ""}
      <div class="row"><span class="l">Max altitude</span><span class="r">${f.maxAltM ? Math.round(f.maxAltM*3.281)+" ft" : "—"}</span></div>
      ${f.maxSpeedMs != null ? `<div class="row"><span class="l">Top speed</span><span class="r">${(f.maxSpeedMs*2.237).toFixed(1)} mph</span></div>` : ""}
      ${f.photos ? `<div class="row"><span class="l">Photos taken</span><span class="r">${f.photos}</span></div>` : ""}
      <div class="row"><span class="l">Location</span><span class="r">${f.city || f.lat.toFixed(4)+", "+f.lon.toFixed(4)}</span></div>
      <div class="row"><span class="l">Flight path</span><span class="r">${f.trackSource === "srt" ? "recovered from footage" : f.hasTrack ? (state.showPaths ? "on map" : "hidden — toggle PATHS") : "point only"}</span></div>
      ${f.videoCount ? `<div class="row"><span class="l">Videos in session</span><span class="r">${f.videoCount}</span></div>` : ""}
      ${f.hasTrack ? "" : `<div class="note">${f.source === "archive" ? "Approximate location from archive folder “" + (f.folder || "") + "” — date from file metadata." : f.source === "aloft" ? "This flight predates on-device logs — summary data only." : "No GPS track in this log — likely an indoor or pre-lock flight."}</div>`}`;
    card.classList.add("show");
    viewer.camera.flyTo({destination: Cesium.Cartesian3.fromDegrees(f.lon, f.lat, 4000), duration: 1.4});
  } else card.classList.remove("show");
}, Cesium.ScreenSpaceEventType.LEFT_CLICK);

// cluster count on hover (numbers live here now, not on the bubbles)
const tip = document.getElementById("clusterTip");
handler.setInputAction(m => {
  const p = viewer.scene.pick(m.endPosition);
  if (p?.id?.cluster) {
    tip.textContent = p.id.count + " flights";
    tip.style.left = (m.endPosition.x + 14) + "px";
    tip.style.top = (m.endPosition.y - 10) + "px";
    tip.style.display = "block";
  } else if (tip.style.display !== "none") tip.style.display = "none";
}, Cesium.ScreenSpaceEventType.MOUSE_MOVE);
</script>
